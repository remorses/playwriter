<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: #ffffff;
    }
    #field-canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }
  </style>
  <div id="root" data-composition-id="field" data-width="1920" data-height="1080">
    <canvas id="field-canvas" width="1920" height="1080"></canvas>
  </div>
  <script>
    // The playwriter.dev hero: an ASCII field of " .:-~=playwriter" in orange, driven by a slow
    // noise instead of the website's video. Its strength follows the scene: strong in the
    // intro and outro, quiet behind the browser.
    ;(function () {
      const { BEAT, everyFrame, random, smooth } = Kit
      const DURATION = 80 * BEAT
      const CELL = 20
      const COLS = Math.ceil(1920 / CELL)
      const ROWS = Math.ceil(1080 / CELL)
      const CHARS = ' .:-~=playwriter'
      // [beat, strength]: field strength over the film
      const STRENGTH = [
        [0, 0.22],
        [3.9, 0.22],
        [5, 0.95],
        [7, 0.95],
        [9, 0.4],
        [53, 0.4],
        [55, 0.6],
        [67, 0.6],
        [69, 1],
        [80, 1],
      ]

      const canvas = document.getElementById('field-canvas')
      const ctx = canvas.getContext('2d')
      ctx.font = '700 15px "JetBrains Mono", monospace'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'

      // value noise on a seeded lattice
      const rnd = random(11)
      const LATTICE = 64
      const grid = Array.from({ length: LATTICE * LATTICE }, () => rnd())
      const cellJitter = Array.from({ length: COLS * ROWS }, () => rnd())
      function lattice(i, j) {
        return grid[(((j % LATTICE) + LATTICE) % LATTICE) * LATTICE + (((i % LATTICE) + LATTICE) % LATTICE)]
      }
      function noise(x, y) {
        const i = Math.floor(x)
        const j = Math.floor(y)
        const fx = smooth(x - i)
        const fy = smooth(y - j)
        const a = lattice(i, j) + (lattice(i + 1, j) - lattice(i, j)) * fx
        const b = lattice(i, j + 1) + (lattice(i + 1, j + 1) - lattice(i, j + 1)) * fx
        return a + (b - a) * fy
      }

      function strengthAt(t) {
        const b = t / BEAT
        for (let i = 1; i < STRENGTH.length; i++) {
          if (b <= STRENGTH[i][0]) {
            const [b0, s0] = STRENGTH[i - 1]
            const [b1, s1] = STRENGTH[i]
            return s0 + (s1 - s0) * smooth((b - b0) / (b1 - b0))
          }
        }
        return STRENGTH[STRENGTH.length - 1][1]
      }

      // Intro only: the cursor leaves a wake of lit characters, its click sends a ring out,
      // and the wheel flicks scroll the field at half speed (parallax).
      const { T: IT, cursorAt, scrollAt } = Kit.intro
      const WAKE_S = 0.8
      const WAKE_R = 70
      const RING_SPEED = 1500
      function introLight(t) {
        if (t > IT.exit + 0.6) return null
        const trail = []
        for (let i = 0; i < 16; i++) {
          const age = (i / 15) * WAKE_S
          if (t - age < IT.enter) break
          trail.push({ ...cursorAt(t - age), k: 1 - age / WAKE_S })
        }
        const ringAge = t - IT.click
        const center = Kit.intro.VERSION
        return { trail, ringAge, center, scroll: scrollAt(t) * 0.5 }
      }

      function draw(t) {
        ctx.clearRect(0, 0, 1920, 1080)
        const strength = strengthAt(t)
        const step = Math.floor(t * 3)
        const light = introLight(t)
        const rowShift = light ? light.scroll / CELL : 0
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            // a band that flows diagonally, like the website's wave
            const rr = r + rowShift
            const n =
              noise(c * 0.07 + t * 0.22, rr * 0.11 - t * 0.06) * 0.7 +
              noise(c * 0.19 - t * 0.1, rr * 0.23 + t * 0.12) * 0.3
            const wave = 0.5 + 0.5 * Math.sin(c * 0.05 - rr * 0.09 + t * 0.5)
            let lum = Math.max(0, n * 1.25 - 0.42) * (0.55 + 0.45 * wave) * strength
            if (light) {
              const x = c * CELL + CELL / 2
              const y = r * CELL + CELL / 2
              for (const p of light.trail) {
                const d2 = (x - p.x) ** 2 + (y - p.y) ** 2
                lum = Math.max(lum, Math.exp(-d2 / (2 * WAKE_R * WAKE_R)) * p.k * 0.75)
              }
              if (light.ringAge > 0 && light.ringAge < 1.6) {
                const d = Math.hypot(x - light.center.x, y - light.center.y)
                const ring = Math.exp(-(((d - light.ringAge * RING_SPEED) / 90) ** 2)) * Math.exp(-light.ringAge * 1.4)
                lum = Math.max(lum, ring * 0.9)
              }
            }
            if (lum < 0.04) continue
            const jitter = ((cellJitter[r * COLS + c] * 7 + step * 0.37) % 1) - 0.5
            const idx = Math.max(1, Math.min(CHARS.length - 1, Math.round(lum * (CHARS.length - 1) * 1.6 + jitter * 4)))
            ctx.fillStyle = `rgba(255, 106, 0, ${Math.min(0.8, lum * 1.3)})`
            ctx.fillText(CHARS[idx], c * CELL + CELL / 2, r * CELL + CELL / 2)
          }
        }
      }

      const tl = gsap.timeline({ paused: true })
      everyFrame(tl, DURATION, draw)
      draw(0)
      window.__timelines['field'] = tl
    })()
  </script>
</template>
