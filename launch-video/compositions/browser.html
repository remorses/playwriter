      const PAGE = { x: WIN.x, y: WIN.y + 104 }
      const page = (x, y) => ({ x: PAGE.x + x, y: PAGE.y + y })

      // ── initial states ─────────────────────────────────────────────────────
      gsap.set(['#b-shop-chip', '#b-tab-checkout', '#b-shop-line'], { opacity: 0 })
      gsap.set(['#b-docs-chip', '#b-tab-api', '#b-tab-log', '#b-docs-line'], { opacity: 0 })
      gsap.set('#b-console', { y: 360 })
      gsap.set('#b-cursor', { x: 900, y: 560, opacity: 0 })

      // ── camera: world point (x, y) at anchor, zoom z ──────────────────────
      const W = (x, y) => page(x, y)
      const CAM = [
        { t: 0, ...{ x: 1250, y: 600 }, z: 0.86 },
        { t: at(9), x: 1250, y: 570, z: 0.98 },
        { t: at(11.5), ...W(330, 190), z: 1.28 },
        { t: at(15.5), ...W(360, 200), z: 1.32 },
        { t: at(17), x: 1250, y: 570, z: 1.02 },
        { t: at(19.5), ...W(330, 420), z: 1.2 },
        { t: at(21.5), ...W(330, 380), z: 1.16 },
        // tab strip
        { t: at(23.2), x: WIN.x + 420, y: WIN.y + 30, z: 1.5, ax: 1290, ay: 330 },
        { t: at(35), x: WIN.x + 470, y: WIN.y + 34, z: 1.56, ax: 1290, ay: 330 },
        // recording: full window, then the REC badge, then back
        { t: at(37), x: 1250, y: 560, z: 0.98 },
        { t: at(38.5), x: WIN.x + 700, y: WIN.y + 300, z: 1.12, ax: 1440, ay: 470 },
        { t: at(42), x: WIN.x + 640, y: WIN.y + 320, z: 1.06, ax: 1400, ay: 500 },
        { t: at(45.5), x: 1260, y: 570, z: 1.04 },
        // console
        { t: at(48.5), ...W(420, 450), z: 1.3, ax: 1300, ay: 620 },
        { t: at(53.2), ...W(460, 470), z: 1.36, ax: 1300, ay: 620 },
      ]
      // anchors default to the right of the text column
      for (const k of CAM) {
        k.ax ??= 1260
        k.ay ??= 560
      }
      function cameraAt(t) {
        const base = camera(CAM.map((k) => ({ ...k, x: k.x - (k.ax - 1260) / k.z, y: k.y - (k.ay - 560) / k.z })), t, { ax: 1260, ay: 560 })
        return base
      }

      // ── human input (beats 8-22) ──────────────────────────────────────────
      // rises as the intro page scrolls away (Kit.intro.T.exit), mirrored ease
      tl.fromTo('#b-world', { y: 900 }, { y: 0, duration: 1.2, ease: 'expo.out' }, Kit.intro.T.exit + 0.08 - 7 * BEAT)
      typeText(tl, $('b-h-cmd'), at(8), 0.022)
      // the --tab-group flag makes the shop group
      tl.fromTo('#b-shop-chip', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, at(9))
      tl.fromTo('#b-tab-checkout', { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.8, ease: 'expo.out' }, at(9) + 0.1)
      tl.fromTo('#b-shop-line', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.8, ease: 'expo.out', transformOrigin: '0 50%' }, at(9) + 0.15)
      blurWords(tl, $('b-h-title'), at(10))

      // cursor 1: curved path to the email field
      const START = { x: 900, y: 600 }
      const EMAIL = { x: 420, y: 238 }
      tl.to('#b-cursor', { opacity: 1, duration: 0.3 }, at(10.6))
      // Cursor track: one entry per move, a function of t only. Holds at the end of each move.
      const MOVES = []
      function moveCursor(path, start, duration, trail = false) {
        MOVES.push({ path, start, duration, trail })
      }
      function drawCursor(t) {
        let m = MOVES[0]
        for (const move of MOVES) if (t >= move.start) m = move
        const u = Kit.easeInOut((t - m.start) / m.duration)
        const q = bezier(m.path, u)
        gsap.set('#b-cursor', { x: q.x - 6, y: q.y - 6 })
        if (m.trail) {
          const pts = []
          for (let i = 0; i <= 40; i++) pts.push(bezier(m.path, (u * i) / 40))
          $('b-trail').setAttribute('d', 'M' + pts.map((v) => `${v.x} ${v.y}`).join(' L'))
        }
      }
      const still = (p) => [p, p, p, p]
      function click(time, target) {
        tl.to('#b-cursor', { scale: 0.82, duration: 0.07, ease: 'power2.in' }, time)
        tl.to('#b-cursor', { scale: 1, duration: 0.22, ease: 'power2.out' }, time + 0.12)
        if (target) tl.fromTo(target, { scale: 1 }, { scale: 0.97, duration: 0.08, yoyo: true, repeat: 1, ease: 'power1.inOut' }, time)
      }
      const path1 = humanPath(START, EMAIL, 0.3)
      $('b-straight').setAttribute('d', `M${START.x} ${START.y} L${EMAIL.x} ${EMAIL.y}`)
      tl.fromTo('#b-straight', { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(10.8))
      tl.set('#b-h-s1', { opacity: 1 }, at(11))
      blurWords(tl, $('b-h-s1'), at(11))
      moveCursor(still(START), 0, 1)
      moveCursor(path1, at(11), 1.05, true)
      const CLICK1 = at(11) + 1.15
      click(CLICK1)
      tl.fromTo('#b-email-ring', { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out' }, CLICK1 + 0.08)
      tl.to(['#b-trail', '#b-straight'], { opacity: 0, duration: 0.6, ease: 'power2.out' }, at(14))

      // typing with human key spacing, 30-110 ms
      const rnd = random(7)
      const email = $('b-email').textContent
      const gaps = [...email].map(() => 0.03 + rnd() * 0.08)
      const TYPE0 = at(13)
      const typed = typeText(tl, $('b-email'), TYPE0, gaps)
      tl.set('#b-h-s2', { opacity: 1 }, TYPE0 - 0.25)
      tl.fromTo('#b-h-ticks', { opacity: 0 }, { opacity: 1, duration: 0.3 }, TYPE0 - 0.2)
      blurWords(tl, $('b-h-s2'), TYPE0 - 0.25)
      tl.fromTo('#b-h-ticks', { opacity: 0 }, { opacity: 1, duration: 0.3 }, TYPE0 - 0.2)
      {
        let t = TYPE0
        const span = typed.end - TYPE0
        const ticks = $('b-ticks')
        ;[...email].forEach((_, i) => {
          const tick = document.createElement('i')
          tick.style.left = `${((t - TYPE0) / span) * 396}px`
          ticks.appendChild(tick)
          tl.fromTo(tick, { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.25, ease: 'back.out(2)', transformOrigin: '50% 100%' }, t)
          t += gaps[i]
        })
      }

      // three wheel flicks
      const FLICK0 = at(16)
      tl.set('#b-h-s3', { opacity: 1 }, FLICK0 - 0.2)
      blurWords(tl, $('b-h-s3'), FLICK0 - 0.2)
      moveCursor(humanPath(EMAIL, { x: 640, y: 380 }, 0.15), FLICK0 - 0.6, 0.7)
      ;[0, 1, 2].forEach((i) => {
        tl.to('#b-shop-scroll', { y: -(i + 1) * 110, duration: 0.42, ease: 'power3.out' }, FLICK0 + i * 0.32)
      })

      // cursor 2: to the Pay button (page y 740 - 330 scroll = 410), click, paid
      const PAY = { x: 380, y: 140 + 640 + 34 - 330 }
      moveCursor(humanPath({ x: 640, y: 380 }, PAY, -0.25), at(18.2), 0.95)
      const CLICK2 = at(18.2) + 1.05
      click(CLICK2, '#b-pay')
      tl.to('#b-paid', { opacity: 1, duration: 0.25, ease: 'power2.out' }, CLICK2 + 0.12)

      // leave: text column slides out left
      const H_OUT = at(22) - EXIT_S
      tl.to(['#b-h-cmd', '#b-h-title', '#b-h-s1', '#b-h-s2', '#b-h-ticks', '#b-h-s3'], { x: -260, opacity: 0, duration: EXIT_S, ease: 'power3.in', stagger: 0.03 }, H_OUT - 0.1)
      tl.to('#b-cursor', { opacity: 0, duration: 0.3 }, at(21.5))

      // ── tabs per session (beats 22-34) ─────────────────────────────────────
      const T = at(22)
      // grey to ink, word by word
      {
        const el = $('b-t-title')
        const words = el.textContent.split(' ')
        el.innerHTML = words.map((w) => `<span style="display:inline-block">${w}</span>`).join(' ')
        tl.fromTo(el.children, { color: '#d4d4d8', opacity: 0 }, { color: '#09090b', opacity: 1, duration: 0.45, stagger: 0.09, ease: 'power2.out' }, T + 0.15)
      }
      tl.fromTo('#b-term-a', { y: 320, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: 'expo.out' }, at(22.6))
      tl.fromTo('#b-term-b', { y: 320, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: 'expo.out' }, at(23.2))
      gsap.set(['#b-a2', '#b-a3', '#b-b3', '#b-b2'], { opacity: 0 })
      const B1_END = typeText(tl, $('b-b1'), at(23.8), 0.026).end
      // agent 2's group appears
      tl.fromTo('#b-docs-chip', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, B1_END + 0.15)
      tl.fromTo(['#b-tab-api', '#b-tab-log'], { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.8, ease: 'expo.out', stagger: 0.12 }, B1_END + 0.25)
      tl.fromTo('#b-docs-line', { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.9, ease: 'expo.out', transformOrigin: '0 50%' }, B1_END + 0.3)

      // agent 1 lists its pages: only the shop tab
      const A = at(27.2)
      tl.set('#b-a2', { opacity: 1 }, A - 0.01)
      const A2_END = typeText(tl, $('b-a2'), A, 0.022).end
      tl.fromTo('#b-a3', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, A2_END + 0.15)
      tl.to(['#b-docs-chip', '#b-tab-api', '#b-tab-log', '#b-docs-line'], { opacity: 0.22, duration: 0.35, ease: 'power2.out' }, A2_END + 0.15)
      // agent 2 lists its pages: only the docs tabs
      const Bt = at(30.8)
      tl.set('#b-b2', { opacity: 1 }, Bt - 0.01)
      tl.to(['#b-docs-chip', '#b-tab-api', '#b-tab-log', '#b-docs-line'], { opacity: 1, duration: 0.3, ease: 'power2.out' }, Bt - 0.2)
      tl.to(['#b-shop-chip', '#b-tab-checkout', '#b-shop-line'], { opacity: 0.22, duration: 0.3, ease: 'power2.out' }, Bt - 0.2)
      const B2_END = typeText(tl, $('b-b2'), Bt, 0.022).end
      tl.fromTo('#b-b3', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'expo.out' }, B2_END + 0.15)
      tl.to(['#b-shop-chip', '#b-tab-checkout', '#b-shop-line'], { opacity: 1, duration: 0.4 }, at(34.6))

      // leave: terminals drop, title out left
      const T_OUT = at(36) - EXIT_S
      tl.to('#b-term-a', { opacity: 0, y: 360, duration: EXIT_S, ease: 'power3.in' }, T_OUT)
      tl.to('#b-term-b', { opacity: 0, y: 360, duration: EXIT_S, ease: 'power3.in' }, T_OUT - 0.06)
      tl.to('#b-t-title', { opacity: 0, x: -240, duration: EXIT_S, ease: 'power3.in' }, T_OUT)

      // ── native recording (beats 34-44) ─────────────────────────────────────
      const R = at(36)
      // the Changelog tab becomes active
      tl.set('#b-tab-checkout', { backgroundColor: 'rgba(53, 54, 58, 0)', color: '#bdc1c6' }, R + 0.2)
      tl.set('#b-tab-log', { backgroundColor: '#35363a', color: '#e8eaed' }, R + 0.2)
      tl.set('#b-docs', { opacity: 1 }, R + 0.2)
      tl.set('#b-url-shop', { opacity: 0 }, R + 0.2)
      tl.set('#b-url-docs', { opacity: 1 }, R + 0.2)
      tl.fromTo('#b-r-title', { opacity: 0, x: 120, filter: 'blur(8px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 1.0, ease: 'expo.out' }, R + 0.15)
      const REC = at(37.6)
      tl.fromTo('#b-rec', { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, REC)
      function counter(el, to, start) {
        const v = { n: 1 }
        tl.fromTo(
          v,
          { n: 1 },
          {
            n: to,
            duration: 1.1,
            ease: 'expo.out',
            immediateRender: false,
            onUpdate: () => {
              el.textContent = v.n > to - 0.05 ? `${to}×` : `${Math.round(v.n)}×`
            },
          },
          start,
        )
      }
      tl.fromTo('#b-r-s1', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.9, ease: 'expo.out' }, at(39))
      counter($('b-r-n1'), 4, at(39))
      tl.fromTo('#b-r-s2', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.9, ease: 'expo.out' }, at(40.4))
      counter($('b-r-n2'), 15, at(40.4))
      tl.set('#b-r-s3', { opacity: 1 }, at(42))
      blurWords(tl, $('b-r-s3'), at(42))
      $('b-r-n1').textContent = '1×'
      $('b-r-n2').textContent = '1×'

      const R_OUT = at(46) - EXIT_S
      tl.to(['#b-r-title', '#b-r-s1', '#b-r-s2', '#b-r-s3'], { opacity: 0, y: -80, duration: EXIT_S, ease: 'power3.in', stagger: 0.04 }, R_OUT - 0.1)

      // ── invisible to the page (beats 44-52) ────────────────────────────────
      const I = at(46)
      tl.to('#b-console', { y: 0, duration: 0.9, ease: 'expo.out' }, I)
      tl.fromTo('#b-i-title', { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 1.0, ease: 'expo.out' }, I + 0.2)
      gsap.set(['#b-c2', '#b-c4'], { opacity: 0 })
      const C1 = typeText(tl, $('b-c1'), at(47.2), 0.03).end
      tl.set('#b-c2', { opacity: 1 }, C1 + 0.25)
      const C3 = typeText(tl, $('b-c3'), C1 + 0.7, 0.018).end
      tl.set('#b-c4', { opacity: 1 }, C3 + 0.25)
      blurWords(tl, $('b-i-note'), at(48.5), { stagger: 0.05 })
      // the ghost cursor glides over the page the whole time: visible to you, not to the page
      tl.to('#b-cursor', { opacity: 1, duration: 0.3 }, I + 0.4)
      moveCursor(still({ x: 900, y: 120 }), I - 0.3, 1)
      moveCursor(humanPath({ x: 900, y: 120 }, { x: 560, y: 240 }, 0.25), I + 0.5, 1.4)
      moveCursor(humanPath({ x: 560, y: 240 }, { x: 760, y: 190 }, -0.3), at(50.5), 2.4)

      // leave: the world and the text slide out left, fast
      const OUT = at(54) - 0.55
      tl.to('#b-world', { x: -2600, duration: 0.55, ease: 'power3.in' }, OUT)
      tl.to(['#b-i-title', '#b-i-note'], { x: -700, opacity: 0, duration: 0.5, ease: 'power3.in', stagger: 0.04 }, OUT - 0.05)

      // ── every frame: camera, REC timer, slow docs scroll ───────────────────
      const camEl = $('b-world')
      const inner = document.createElement('div')
      // camera on an inner wrapper so the world's own entrance/exit tweens stay separate
      inner.id = 'b-cam'
      inner.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0'
      while (camEl.firstChild) inner.appendChild(camEl.firstChild)
      camEl.appendChild(inner)
      everyFrame(tl, DURATION, (t) => {
        applyCamera(inner, cameraAt(t))
        drawCursor(t)
        const docsY = -Math.max(0, t - R) * 34
        $('b-docs-scroll').style.transform = `translateY(${docsY}px)`
      })

      window.__timelines['browser'] = tl
    })()
  </script>
</template>
