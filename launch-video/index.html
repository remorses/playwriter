      <audio id="sfx-22" src="assets/sfx/typing.mp3" data-start="16.214" data-duration="0.800" data-track-index="12" data-volume="0.313"></audio>

      <audio id="sfx-23" src="assets/sfx/text-tap-down4.mp3" data-start="17.071" data-duration="0.587" data-track-index="11" data-volume="0.285"></audio>

      <audio id="sfx-24" src="assets/sfx/whoosh-digital.mp3" data-start="18.686" data-duration="0.920" data-track-index="11" data-volume="0.219"></audio>
