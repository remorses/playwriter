  <div id="root" data-composition-id="outro" data-width="1920" data-height="1080" data-layout-allow-overflow>

      <img id="o-icon" src="assets/logo.svg" alt="" />
      <img id="o-wordmark" src="assets/wordmark.svg" alt="playwriter" />

  <script src="assets/timeline.js"></script>
  <script>
    // The mark lands on "handoff", the wordmark writes on "Playwriter". No other text.
    ;(function () {
      const { EV, HOSTS, word } = window.TIMELINE
      const local = (t) => t - HOSTS.outro[0]
      const DURATION = HOSTS.outro[1] - HOSTS.outro[0]
      const tl = gsap.timeline({ paused: true })

      tl.fromTo('#o-icon', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(1.7)' }, local(EV.logo))
      tl.fromTo('#o-wordmark', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 1.1, ease: 'power2.inOut' }, local(word('l9', 'latest')))
      // slow push in, never still
      tl.fromTo('#o-stage', { scale: 0.97 }, { scale: 1.04, duration: DURATION, ease: 'none', transformOrigin: '50% 50%' }, 0)

      window.__timelines['outro'] = tl
    })()
  </script>
